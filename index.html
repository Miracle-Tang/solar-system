<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ffd27d'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='5' fill='none' stroke='%237dd3fc' stroke-width='1.4' opacity='.7'/%3E%3C/svg%3E">
<title>SOLARIS · 太阳系漫游</title>
<style>
  :root {
    --glass: rgba(14, 16, 34, 0.55);
    --glass-border: rgba(150, 170, 255, 0.18);
    --text: #cdd6f2;
    --text-dim: #6f7896;
    --accent: #ffd27d;
    --accent-2: #7dd3fc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 130% 100% at 50% 50%, #10102a 0%, #070714 55%, #030309 100%);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
    user-select: none; -webkit-user-select: none;
  }
  #stage { position: fixed; inset: 0; display: block; cursor: grab; }
  #stage.dragging { cursor: grabbing; }

  /* ---------- 标题 ---------- */
  #brand { position: fixed; top: 22px; left: 28px; z-index: 10; pointer-events: none;
    opacity: 0; animation: fadeIn 1.4s ease .3s forwards; }
  #brand h1 {
    font-size: 26px; font-weight: 600; letter-spacing: 7px;
    background: linear-gradient(90deg, #ffe3a3, #ffb37d 45%, #7dd3fc);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 34px rgba(255, 190, 110, 0.22);
  }
  #brand p { margin-top: 6px; font-size: 12px; letter-spacing: 4px; color: var(--text-dim); }

  /* ---------- 控制面板 ---------- */
  #panel {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    z-index: 10; display: flex; align-items: center; gap: 13px;
    padding: 11px 18px; border-radius: 18px;
    background: var(--glass); border: 1px solid var(--glass-border);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    opacity: 0; animation: fadeIn 1.4s ease .8s forwards;
    max-width: calc(100vw - 24px); flex-wrap: wrap; justify-content: center;
  }
  #playBtn {
    border: 1px solid var(--glass-border); background: rgba(255,210,125,.10);
    color: var(--accent); width: 34px; height: 34px; border-radius: 50%;
    cursor: pointer; font-size: 13px; transition: all .2s; line-height: 1;
  }
  #playBtn:hover { background: rgba(255,210,125,.22); }
  .ctrl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); }
  .ctrl label { letter-spacing: 1px; white-space: nowrap; }
  #spdVal { min-width: 40px; color: var(--text); font-variant-numeric: tabular-nums; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100px; height: 3px; border-radius: 2px;
    background: rgba(150,170,255,.25); outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
    background: linear-gradient(135deg, #ffe3a3, #ffb37d);
    box-shadow: 0 0 10px rgba(255,190,110,.6); cursor: pointer;
  }
  .switch { position: relative; width: 34px; height: 18px; cursor: pointer; display: inline-block; }
  .switch input { display: none; }
  .switch i { position: absolute; inset: 0; border-radius: 10px; background: rgba(0,0,0,.35);
    border: 1px solid var(--glass-border); transition: all .22s; }
  .switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--text-dim); transition: all .22s; }
  .switch input:checked + i { background: rgba(255,210,125,.22); border-color: rgba(255,210,125,.5); }
  .switch input:checked + i::after { left: 18px; background: #ffe3a3; box-shadow: 0 0 8px rgba(255,210,125,.8); }
  #backBtn {
    display: none; border: 1px solid var(--glass-border); background: rgba(125,211,252,.10);
    color: var(--accent-2); font-size: 12px; letter-spacing: 2px; padding: 7px 14px;
    border-radius: 10px; cursor: pointer; transition: all .2s; font-family: inherit;
  }
  #backBtn.show { display: block; }
  #backBtn:hover { background: rgba(125,211,252,.22); }

  /* ---------- 目标导航条 ---------- */
  #nav {
    position: fixed; left: 50%; bottom: 94px; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 5px; padding: 7px 11px; border-radius: 14px;
    background: var(--glass); border: 1px solid var(--glass-border);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 40px rgba(0,0,0,.45);
    opacity: 0; animation: fadeIn 1.4s ease 1.15s forwards;
    max-width: calc(100vw - 24px); flex-wrap: wrap; justify-content: center;
  }
  #nav button {
    border: none; background: transparent; color: var(--text-dim);
    font-size: 12px; letter-spacing: 1px; padding: 5px 10px; border-radius: 8px;
    cursor: pointer; transition: all .2s; font-family: inherit; white-space: nowrap;
  }
  #nav button:hover { color: var(--text); background: rgba(255,255,255,.07); }
  #nav button.on {
    color: #1a1206; font-weight: 600;
    background: linear-gradient(135deg, #ffe3a3, #ffb37d);
    box-shadow: 0 2px 12px rgba(255,190,110,.35);
  }
  #hintBtn {
    border: 1px solid var(--glass-border); background: rgba(0,0,0,.25); color: var(--text-dim);
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 14px; transition: all .2s;
  }
  #hintBtn:hover { color: var(--accent-2); border-color: rgba(125,211,252,.5); }

  /* ---------- 帮助 ---------- */
  #help { position: fixed; inset: 0; z-index: 30; display: none;
    align-items: center; justify-content: center;
    background: rgba(3,4,10,.6); backdrop-filter: blur(6px); }
  #help.show { display: flex; animation: fadeIn .25s ease; }
  #helpCard { width: min(460px, calc(100vw - 40px)); border-radius: 20px; padding: 28px 30px;
    background: rgba(18,20,40,.94); border: 1px solid var(--glass-border);
    box-shadow: 0 20px 80px rgba(0,0,0,.6); }
  #helpCard h2 { font-size: 16px; letter-spacing: 4px; margin-bottom: 16px; color: var(--accent); }
  #helpCard table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 1.5; }
  #helpCard td { padding: 6px 0; }
  #helpCard td:first-child { color: var(--text-dim); white-space: nowrap; padding-right: 18px; letter-spacing: 1px; }
  #helpCard kbd { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 11.5px;
    background: rgba(0,0,0,.4); border: 1px solid var(--glass-border); border-bottom-width: 2px;
    font-family: Consolas, monospace; color: var(--accent); }
  #helpClose { margin-top: 20px; width: 100%; padding: 9px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--glass-border); background: rgba(255,210,125,.1);
    color: var(--accent); font-size: 13px; letter-spacing: 4px; transition: background .2s; }
  #helpClose:hover { background: rgba(255,210,125,.22); }

  /* ---------- 悬停标签 & 信息卡 ---------- */
  #tip { position: fixed; z-index: 15; pointer-events: none; display: none;
    padding: 4px 12px; border-radius: 999px; font-size: 12px; letter-spacing: 2px;
    background: rgba(10,12,26,.8); border: 1px solid var(--glass-border); color: var(--text);
    backdrop-filter: blur(8px); transform: translate(-50%, -160%); white-space: nowrap; }
  #card {
    position: fixed; left: 26px; bottom: 96px; z-index: 12; width: 250px;
    padding: 18px 20px; border-radius: 16px; display: none;
    background: var(--glass); border: 1px solid var(--glass-border);
    backdrop-filter: blur(14px); box-shadow: 0 10px 44px rgba(0,0,0,.5);
    opacity: 0; transition: opacity .35s ease;
  }
  #card.show { display: block; }
  #card.vis { opacity: 1; }
  #card h3 { font-size: 19px; letter-spacing: 5px; color: var(--accent); margin-bottom: 2px; }
  #card .en { font-size: 11px; letter-spacing: 3px; color: var(--text-dim); margin-bottom: 10px; }
  #card .row { display: flex; justify-content: space-between; font-size: 12px; padding: 3.5px 0;
    border-bottom: 1px dashed rgba(150,170,255,.12); }
  #card .row span:first-child { color: var(--text-dim); }
  #card .fun { margin-top: 10px; font-size: 12px; line-height: 1.65; color: #e8d9ff; }
  #card .fun::before { content: "✦ "; color: var(--accent); }

  #toast { position: fixed; top: 26px; left: 50%; z-index: 20;
    transform: translateX(-50%) translateY(-8px); padding: 8px 22px; border-radius: 999px;
    font-size: 13px; letter-spacing: 3px; background: var(--glass);
    border: 1px solid var(--glass-border); backdrop-filter: blur(10px);
    opacity: 0; pointer-events: none; transition: opacity .35s, transform .35s; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @keyframes fadeIn { to { opacity: 1; } }
  @media (max-width: 720px) {
    #brand h1 { font-size: 19px; letter-spacing: 4px; }
    #panel { gap: 9px; padding: 9px 12px; }
    #card { left: 12px; bottom: 130px; width: 210px; padding: 14px 16px; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="brand"><h1>SOLARIS</h1><p>太 阳 系 漫 游 · 点 击 行 星 抵 达</p></div>

<div id="panel">
  <button id="playBtn" title="暂停 / 播放">❚❚</button>
  <div class="ctrl"><label>速度</label><input type="range" id="spd" min="0" max="10" step="0.1" value="1"><span id="spdVal">1.0×</span></div>
  <div class="ctrl"><label>轨道</label><label class="switch"><input type="checkbox" id="swOrbit" checked><i></i></label></div>
  <div class="ctrl"><label>标签</label><label class="switch"><input type="checkbox" id="swLabel" checked><i></i></label></div>
  <div class="ctrl"><label>声音</label><label class="switch"><input type="checkbox" id="swSnd"><i></i></label></div>
  <button id="backBtn">返回全景</button>
  <button id="hintBtn" title="操作说明">?</button>
</div>

<div id="help">
  <div id="helpCard">
    <h2>漫游指南</h2>
    <table>
      <tr><td>滚轮</td><td>缩放整个太阳系（0.4× ~ 10×）</td></tr>
      <tr><td>拖拽</td><td>平移视角</td></tr>
      <tr><td>悬停行星</td><td>显示名称标签</td></tr>
      <tr><td>点击行星</td><td>镜头飞向并跟随该行星，展示档案</td></tr>
      <tr><td>导航条 / <kbd>←</kbd><kbd>→</kbd></td><td>在 太阳 → 行星 → 彗星 之间随意切换视角</td></tr>
      <tr><td><kbd>Esc</kbd> / 空白处</td><td>返回全景视角</td></tr>
      <tr><td><kbd>Space</kbd></td><td>暂停 / 继续时间流动</td></tr>
      <tr><td>速度滑块</td><td>0（冻结）~ 10× 时间流速</td></tr>
    </table>
    <button id="helpClose">启程</button>
  </div>
</div>

<div id="nav"></div>

<div id="tip"></div>
<div id="card">
  <h3 id="cName">—</h3><div class="en" id="cEn">—</div>
  <div class="row"><span>直径</span><span id="cDia">—</span></div>
  <div class="row"><span>公转周期</span><span id="cPer">—</span></div>
  <div class="row"><span>距太阳</span><span id="cDist">—</span></div>
  <div class="fun" id="cFun">—</div>
</div>
<div id="toast"></div>

<script>
(() => {
"use strict";
/* ============================================================
   SOLARIS · 太阳系漫游
   单文件零依赖。开普勒式角速度 · 受光面渐变行星 · 土星环遮挡
   小行星带 · 近日点彗尾 · 日冕耀斑 · 镜头飞行跟随 · 氛围音效
   ============================================================ */

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let W = 0, H = 0, CX = 0, CY = 0;

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---------- 相机 ---------- */
const cam = { x: 0, y: 0, zoom: 1, tx: 0, ty: 0, tzoom: 1 };
const ZMIN = 0.25, ZMAX = 10;
const warp = { amt: 0, prevX: 0, prevY: 0 };           // 镜头飞行速度线
const streaks = [];                                     // 速度线缓存（角度/起点随机）
(function initStreaks() {
  for (let i = 0; i < 36; i++) streaks.push({ ang: rand(0, TAU), r0: rand(0.34, 0.6), len: rand(0.14, 0.32), w: rand(1.0, 2.4) });
})();

/* ---------- 特效队列：锁定环 / 近日点闪光 ---------- */
const fx = [];

/* ---------- 太阳风 ---------- */
const solarWind = [];
(function initWind() {
  for (let i = 0; i < 130; i++) {
    solarWind.push({
      ang: rand(0, TAU),
      r: rand(38, 470),            // 起点 > 太阳半径（此时 sun 尚未初始化）
      spd: rand(7, 18),
      a: rand(0.12, 0.4),
      size: rand(0.6, 1.5),
    });
  }
})();

/* ---------- 时间 ---------- */
let simT = 0;                 // 模拟时间（年）
let speed = 1, paused = false;

/* ---------- 交互状态 ---------- */
const mouse = { x: -1, y: -1, active: false };
let hoverBody = null;
let focusBody = null;         // 跟随的天体（null = 全景）
const drag = { on: false, moved: false, sx: 0, sy: 0, cx: 0, cy: 0 };

/* ---------- 天体档案 ---------- */
// r: 屏幕基準轨道半径（观感压缩），size: 绘制半径，period: 相对公转周期
// 开普勒感：角速度 ∝ r^-1.5，内行星明显快
const BODIES = [
  { id:"mercury", name:"水星", en:"MERCURY", r:  78, size: 3.4, dia:"4,879 km", per:"88 天",  dist:"0.39 AU",
    base:"#b8a798", dark:"#4a4038", glow:null, fun:"最小也最神秘的行星，一天比一年还长。" },
  { id:"venus",   name:"金星", en:"VENUS",   r: 112, size: 5.6, dia:"12,104 km", per:"225 天", dist:"0.72 AU",
    base:"#f0d9a8", dark:"#7a5f3a", glow:"rgba(255,220,150,.16)", fun:"温室效应失控的世界，表面 464°C，还是逆向自转。" },
  { id:"earth",   name:"地球", en:"EARTH",   r: 150, size: 6.0, dia:"12,742 km", per:"365 天", dist:"1.00 AU",
    base:"#6fb7e8", dark:"#123a6e", glow:"rgba(120,190,255,.22)", fun:"目前已知唯一存在生命的星球，也是我们的一切。",
    moon:{ r: 13, size: 1.7, period: 0.25, base:"#c9c9d4", dark:"#555560" } },
  { id:"mars",    name:"火星", en:"MARS",    r: 192, size: 4.6, dia:"6,779 km", per:"687 天", dist:"1.52 AU",
    base:"#e8825a", dark:"#6e2c1a", glow:"rgba(255,140,100,.12)", fun:"奥林帕斯山高约 22 km，是太阳系最高的山峰。" },
  { id:"jupiter", name:"木星", en:"JUPITER", r: 268, size: 15,  dia:"139,820 km", per:"11.9 年", dist:"5.20 AU",
    base:"#e8c39a", dark:"#7a4a2c", glow:null, fun:"大红斑是一场持续了至少 350 年的风暴，能装下整个地球。",
    bands: true, spot: true },
  { id:"saturn",  name:"土星", en:"SATURN",  r: 340, size: 12.5,dia:"116,460 km", per:"29.5 年", dist:"9.58 AU",
    base:"#eeddb2", dark:"#8a6f42", glow:null, fun:"平均密度比水还低——如果有足够大的浴缸，它能浮起来。",
    ring: true },
  { id:"uranus",  name:"天王星", en:"URANUS", r: 408, size: 9,  dia:"50,724 km", per:"84 年",  dist:"19.2 AU",
    base:"#a8e6e2", dark:"#2c6a72", glow:"rgba(150,235,230,.14)", fun:"自转轴倾斜 98°，几乎是「躺着」绕太阳滚动。" },
  { id:"neptune", name:"海王星", en:"NEPTUNE", r: 470, size: 8.6,dia:"49,244 km", per:"164.8 年", dist:"30.1 AU",
    base:"#6f8fe8", dark:"#1c2a6e", glow:"rgba(120,150,255,.16)", fun:"风速可达 2,100 km/h，是太阳系最狂暴的大气。" },
];
BODIES.forEach((b, i) => {
  b.ang = rand(0, TAU);
  b.angSpd = TAU * 0.06 * Math.pow(150 / b.r, 1.5);   // 开普勒式：内快外慢
  b.phase = rand(0, TAU);
  b.viewZoom = clamp(95 / b.size, 1.6, 6.2);          // 点击跟随时的推荐观察距离
});
const sun = { name:"太阳", en:"SOL", size: 30, dia:"1,392,700 km", per:"—", dist:"0 AU",
  viewZoom: 2.6,
  fun:"占整个太阳系质量的 99.86%，每秒把 400 万吨物质变成光。" };

/* ---------- 彗星 ---------- */
const comet = {
  a: 300, e: 0.7, ang: rand(0, TAU), size: 2.2,
  name:"彗星", en:"COMET", dia:"~11 km", per:"~76 年", dist:"0.3 – 30 AU",
  viewZoom: 3.2,
  fun:"冰与尘埃构成的「脏雪球」，逼近太阳时升华喷尾，尾巴永远背向太阳。",
};
// 椭圆轨道参数化：太阳位于焦点，极坐标直接给出焦点系坐标
function cometPos() {
  const a = comet.a, e = comet.e;
  const th = comet.ang;
  const r = a * (1 - e * e) / (1 + e * Math.cos(th));
  return { x: r * Math.cos(th), y: r * Math.sin(th) * 0.98, r };
}

/* ---------- 小行星带 ---------- */
const asteroids = [];
(function initAsteroids() {
  for (let i = 0; i < 760; i++) {
    const a = rand(214, 246) + rand(-6, 6);
    asteroids.push({
      a,
      ang: rand(0, TAU),
      spd: TAU * 0.06 * Math.pow(150 / a, 1.5) * rand(0.9, 1.1),
      size: rand(0.4, 1.4),
      tone: rand(0.45, 0.9),
    });
  }
})();

/* ---------- 星空层（预渲染 + 视差） ---------- */
const starLayers = [];
function buildStars() {
  starLayers.length = 0;
  const defs = [
    { n: 190, f: 0.030, sMin: 0.4, sMax: 1.0, alpha: 0.5 },
    { n: 120, f: 0.070, sMin: 0.7, sMax: 1.5, alpha: 0.75 },
    { n: 55,  f: 0.130, sMin: 1.1, sMax: 2.1, alpha: 1.0 },
  ];
  for (const d of defs) {
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const g = c.getContext("2d");
    // 银河尘埃带（仅最远层）：沿对角线的星云团块 + 密集星尘
    if (d.f === 0.030) {
      const bandN = 46;
      for (let i = 0; i < bandN; i++) {
        const t = i / bandN + rand(-0.03, 0.03);
        const bx = t * W * 1.2 - W * 0.1;
        const by = H * 0.72 - t * H * 0.5 + rand(-H * 0.07, H * 0.07);
        const br = rand(60, 170);
        const hue = Math.random() < 0.55 ? "255, 225, 190" : "170, 190, 255";
        const gg = g.createRadialGradient(bx, by, 0, bx, by, br);
        gg.addColorStop(0, `rgba(${hue}, ${rand(0.020, 0.050)})`);
        gg.addColorStop(1, "rgba(0,0,0,0)");
        g.fillStyle = gg;
        g.beginPath(); g.arc(bx, by, br, 0, TAU); g.fill();
      }
      for (let i = 0; i < 260; i++) {
        const t = Math.random();
        const bx = t * W * 1.2 - W * 0.1;
        const by = H * 0.72 - t * H * 0.5 + rand(-H * 0.09, H * 0.09);
        g.globalAlpha = rand(0.10, 0.42);
        g.fillStyle = "#e8e4ff";
        g.fillRect(bx, by, rand(0.5, 1.1), rand(0.5, 1.1));
      }
      g.globalAlpha = 1;
    }
    for (let i = 0; i < d.n; i++) {
      const x = rand(0, W), y = rand(0, H), s = rand(d.sMin, d.sMax);
      const hue = pickStarColor();
      g.globalAlpha = d.alpha * rand(0.4, 1);
      g.fillStyle = hue;
      g.beginPath(); g.arc(x, y, s, 0, TAU); g.fill();
      if (s > 1.6) { g.globalAlpha *= 0.25; g.beginPath(); g.arc(x, y, s * 2.4, 0, TAU); g.fill(); }
    }
    starLayers.push({ canvas: c, f: d.f });
  }
}
function pickStarColor() {
  const t = Math.random();
  return t < 0.62 ? "#cdd8ff" : t < 0.85 ? "#ffffff" : t < 0.95 ? "#ffe3c4" : "#ffc4d4";
}

/* ---------- 耀斑（日珥） ---------- */
const flares = [];
(function initFlares() {
  for (let i = 0; i < 5; i++) {
    flares.push({
      baseAng: rand(0, TAU),
      spread: rand(0.5, 0.9),
      speed: rand(0.25, 0.5),
      phase: rand(0, 1),
      h: rand(0.5, 1.1),          // 喷发高度（太阳半径倍数）
      hue: rand(15, 45),
    });
  }
})();

/* ---------- 尺寸 ---------- */
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  CX = W / 2; CY = H / 2;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildStars();
}
let resizeTimer = 0;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 120); });

/* ============================================================
   音效（全合成）：氛围垫 + 悬停/点击
   ============================================================ */
let AC = null, master = null, padOn = false, padNodes = null;
function ensureAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
  } catch (e) { AC = null; }
}
function startPad() {
  if (!AC || padOn) return;
  padOn = true;
  const t = AC.currentTime;
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.10, t + 2.5);
  const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 420; lp.Q.value = 0.6;
  // 两个失谐正弦 + 五度，营造深空嗡鸣
  const oscs = [[55, 0], [55.4, 0], [82.5, -0.02]].map(([f, det]) => {
    const o = AC.createOscillator(); o.type = "sine"; o.frequency.value = f; o.detune.value = det;
    o.connect(lp); o.start(); return o;
  });
  // 缓慢 LFO 呼吸
  const lfo = AC.createOscillator(); lfo.frequency.value = 0.07;
  const lfoG = AC.createGain(); lfoG.gain.value = 0.035;
  lfo.connect(lfoG); lfoG.connect(g.gain); lfo.start();
  lp.connect(g); g.connect(master);
  padNodes = { oscs, lfo, g };
}
function stopPad() {
  if (!AC || !padOn) return;
  const t = AC.currentTime;
  padNodes.g.gain.cancelScheduledValues(t);
  padNodes.g.gain.setValueAtTime(padNodes.g.gain.value, t);
  padNodes.g.gain.linearRampToValueAtTime(0.0001, t + 0.8);
  const nodes = padNodes;
  setTimeout(() => { nodes.oscs.forEach(o => o.stop()); nodes.lfo.stop(); }, 900);
  padNodes = null; padOn = false;
}
function sfxBlip(f = 520, dur = 0.18, vol = 0.10) {
  if (!AC || !CFG.sound) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(f, t);
  o.frequency.exponentialRampToValueAtTime(f * 1.5, t + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function sfxWhoosh() {
  if (!AC || !CFG.sound) return;
  const t = AC.currentTime, dur = 1.4;
  const n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = AC.createBufferSource(); src.buffer = buf;
  const bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.1;
  bp.frequency.setValueAtTime(180, t);
  bp.frequency.exponentialRampToValueAtTime(1400, t + dur * 0.7);
  bp.frequency.exponentialRampToValueAtTime(300, t + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.16, t + 0.12);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(bp); bp.connect(g); g.connect(master); src.start(t);
}

/* ============================================================
   坐标变换
   ============================================================ */
function w2s(wx, wy) {
  return { x: (wx - cam.x) * cam.zoom + CX, y: (wy - cam.y) * cam.zoom + CY };
}
function s2w(sx, sy) {
  return { x: (sx - CX) / cam.zoom + cam.x, y: (sy - CY) / cam.zoom + cam.y };
}

/* ============================================================
   更新
   ============================================================ */
let lastT = performance.now();

function update(dtSec) {
  const dt = paused ? 0 : dtSec * speed;
  simT += dt;
  for (const b of BODIES) b.ang += b.angSpd * dt;
  for (const a of asteroids) a.ang += a.spd * dt;
  // 彗星：面积速率近似（dθ/dt ∝ 1/r²），近日点明显加速
  const c = cometPos();
  const prevAng = comet.ang;
  comet.ang += (2000 / (c.r * c.r)) * dt;
  // 掠过近日点（角度跨 0）→ 闪光彩蛋
  if (dt > 0 && prevAng > Math.PI * 1.8 && comet.ang < Math.PI * 0.2) {
    fx.push({ type: "flash", t: 0 });
    showToast("彗星掠过近日点");
  }
  // 彗尾粒子（实时视觉效果，速度钳制避免高倍速下失控）
  const dtEff = paused ? 0 : dtSec * clamp(speed, 0, 3);
  updateCometTail(c, dtSec, dtEff);

  // 太阳风粒子：径向飘散，吹出画面后重生
  for (const p of solarWind) {
    p.r += p.spd * dt * 0.55;
    if (p.r > 486) { p.r = rand(38, 60); p.ang = rand(0, TAU); }
  }

  // 特效队列推进
  for (let i = fx.length - 1; i >= 0; i--) {
    fx[i].t += dtSec / (fx[i].type === "flash" ? 1.4 : 0.75);
    if (fx[i].t >= 1) fx.splice(i, 1);
  }

  // 相机跟随（彗星为动态目标）
  if (focusBody) {
    const p = focusPos(focusBody);
    cam.tx = p.x; cam.ty = p.y;
  }
  const k = 1 - Math.pow(0.0022, dtSec);      // 帧率无关平滑
  cam.x = lerp(cam.x, cam.tx, k);
  cam.y = lerp(cam.y, cam.ty, k);
  // 缩放在对数空间插值：远近飞行匀速丝滑，无"先猛后停"感
  cam.zoom = Math.exp(lerp(Math.log(cam.zoom), Math.log(cam.tzoom), k));
  // 镜头速度 → warp 强度（仅镜头飞向目标时出现速度线，拖拽平移不触发）
  const camSpd = Math.hypot(cam.x - warp.prevX, cam.y - warp.prevY) * cam.zoom;
  warp.prevX = cam.x; warp.prevY = cam.y;
  const warpTarget = focusBody ? clamp((camSpd - 30) / 260, 0, 1) : 0;
  warp.amt = lerp(warp.amt, warpTarget, 1 - Math.pow(0.008, dtSec));

  // 悬停检测（屏幕空间，即时拾取）
  hoverBody = null;
  if (mouse.active) hoverBody = pickBody(mouse.x, mouse.y);
  canvas.style.cursor = drag.on ? "grabbing" : (hoverBody ? "pointer" : "grab");

  // 信息卡 / 标签 DOM
  syncDom();
}

// 悬停拾取：行星 + 彗星 + 太阳（太阳优先级最低）
function pickBody(sx, sy) {
  let best = 1e9, hit = null;
  const cand = [...BODIES, comet];
  for (const b of cand) {
    const p = focusPos(b);
    const s = w2s(p.x, p.y);
    const rr = Math.max(b.size * cam.zoom, 9) + 10;
    const d = Math.hypot(sx - s.x, sy - s.y);
    if (d < rr && d < best) { best = d; hit = b; }
  }
  if (!hit) {
    const s = w2s(0, 0);
    const rr = Math.max(sun.size * cam.zoom, 12) + 8;
    if (Math.hypot(sx - s.x, sy - s.y) < rr) hit = sun;
  }
  return hit;
}

function bodyPos(b) {
  return { x: Math.cos(b.ang) * b.r, y: Math.sin(b.ang) * b.r };
}
// 焦点天体的当前位置（彗星动态计算）
function focusPos(b) {
  return b === comet ? cometPos() : b === sun ? { x: 0, y: 0 } : bodyPos(b);
}
// 视角切换的目标序列：太阳 → 八大行星 → 彗星
function focusOrder() { return [sun, ...BODIES, comet]; }

/* ---------- 彗尾 ---------- */
const cometParts = [];
function updateCometTail(c, dtSec, dtEff) {
  const near = clamp(1 - (c.r - 130) / 300, 0, 1);       // 越近日越旺
  const emit = near > 0.06 ? Math.ceil(near * 5) : 0;
  const dir = Math.atan2(c.y, c.x);                       // 背向太阳
  for (let i = 0; i < emit; i++) {
    const spread = rand(-0.30, 0.30);
    cometParts.push({
      x: c.x, y: c.y,
      vx: Math.cos(dir + spread) * rand(18, 58) * (0.4 + near),
      vy: Math.sin(dir + spread) * rand(18, 58) * (0.4 + near),
      life: 1, decay: rand(0.38, 0.85),
      size: rand(0.8, 2.2),
      hue: rand(185, 205),
    });
  }
  for (let i = cometParts.length - 1; i >= 0; i--) {
    const p = cometParts[i];
    p.x += p.vx * dtEff;
    p.y += p.vy * dtEff;
    p.life -= p.decay * dtSec;
    if (p.life <= 0) cometParts.splice(i, 1);
  }
  if (cometParts.length > 600) cometParts.splice(0, cometParts.length - 600);
}

/* ============================================================
   渲染
   ============================================================ */
function render(now) {
  ctx.clearRect(0, 0, W, H);

  /* --- 星空视差 --- */
  for (const L of starLayers) {
    const ox = (-cam.x * cam.zoom * L.f) % W;
    const oy = (-cam.y * cam.zoom * L.f) % H;
    ctx.drawImage(L.canvas, ox, oy);
    ctx.drawImage(L.canvas, ox - W, oy);
    ctx.drawImage(L.canvas, ox, oy - H);
    ctx.drawImage(L.canvas, ox - W, oy - H);
  }

  /* --- 世界坐标 --- */
  ctx.save();
  ctx.translate(CX, CY);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);

  /* --- 轨道线（悬停目标高亮） --- */
  if (CFG.orbits) {
    ctx.lineWidth = 1 / cam.zoom;
    for (const b of BODIES) {
      ctx.strokeStyle = hoverBody === b ? "rgba(255, 214, 150, 0.42)" : "rgba(150, 170, 230, 0.13)";
      ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU); ctx.stroke();
    }
    // 彗星轨道
    ctx.strokeStyle = hoverBody === comet ? "rgba(140, 220, 250, 0.38)" : "rgba(120, 200, 235, 0.10)";
    ctx.beginPath();
    const a = comet.a, e = comet.e, b2 = a * Math.sqrt(1 - e * e);
    ctx.ellipse(-a * e, 0, a, b2, 0, 0, TAU);
    ctx.stroke();
  }

  /* --- 太阳风：从太阳径向吹出的微粒 --- */
  for (const p of solarWind) {
    const fade = clamp(1 - p.r / 500, 0, 1);
    ctx.fillStyle = `rgba(255, 205, 130, ${p.a * fade})`;
    const x = Math.cos(p.ang) * p.r, y = Math.sin(p.ang) * p.r;
    ctx.fillRect(x - p.size / 2, y - p.size / 2, p.size, p.size);
  }

  /* --- 小行星带（zoom 大时淡出，避免遮挡行星特写） --- */
  const astFade = clamp(1.25 / cam.zoom, 0.22, 1);
  for (const a of asteroids) {
    const x = Math.cos(a.ang) * a.a, y = Math.sin(a.ang) * a.a;
    ctx.fillStyle = `rgba(200, 194, 182, ${a.tone * 0.62 * astFade})`;
    const s = a.size * clamp(Math.pow(1 / cam.zoom, 0.6), 0.45, 1.1);
    ctx.fillRect(x - s / 2, y - s / 2, s, s);
  }

  /* --- 彗尾粒子 --- */
  for (const p of cometParts) {
    ctx.globalAlpha = p.life * 0.7;
    ctx.fillStyle = `hsl(${p.hue}, 90%, 74%)`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.6, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* --- 行星（含拖尾弧） --- */
  for (const b of BODIES) {
    const p = bodyPos(b);
    // 运动方向拖尾弧（细而淡，仅作方向感）
    if (CFG.orbits) {
      const dirSign = Math.sign(b.angSpd);
      const streak = clamp(0.55 * speed * (paused ? 0 : 1), 0.06, 0.9);
      const segs = 24;
      for (let i = 0; i < segs; i++) {
        const a0 = b.ang - dirSign * (i / segs) * streak;
        const a1 = b.ang - dirSign * ((i + 1) / segs) * streak;
        ctx.strokeStyle = `rgba(170, 195, 255, ${(1 - i / segs) * 0.11})`;
        ctx.lineWidth = b.size * 0.22 * (1 - i / segs * 0.6);
        ctx.beginPath();
        ctx.arc(0, 0, b.r, Math.min(a0, a1), Math.max(a0, a1));
        ctx.stroke();
      }
    }
    drawPlanet(b, p.x, p.y, now);
  }

  /* --- 太阳 --- */
  drawSun(now);

  /* --- 彗星本体 --- */
  const cp = cometPos();
  {
    const g = ctx.createRadialGradient(cp.x, cp.y, 0, cp.x, cp.y, 8);
    g.addColorStop(0, "rgba(220, 250, 255, 0.95)");
    g.addColorStop(0.4, "rgba(150, 225, 250, 0.55)");
    g.addColorStop(1, "rgba(150, 225, 250, 0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cp.x, cp.y, 8, 0, TAU); ctx.fill();
    ctx.fillStyle = "#eafcff";
    ctx.beginPath(); ctx.arc(cp.x, cp.y, 1.6, 0, TAU); ctx.fill();
  }

  ctx.restore();

  /* --- 屏幕空间：标签 --- */
  if (CFG.labels) {
    ctx.font = "11px 'Segoe UI', 'Microsoft YaHei', sans-serif";
    ctx.textAlign = "center";
    const labeled = [...BODIES, comet];
    for (const b of labeled) {
      const p = focusPos(b);
      const s = w2s(p.x, p.y);
      if (s.x < -40 || s.x > W + 40 || s.y < -20 || s.y > H + 20) continue;
      ctx.fillStyle = hoverBody === b ? "rgba(255, 225, 160, .95)" : "rgba(190, 205, 245, .55)";
      ctx.fillText(b.name, s.x, s.y - Math.max(b.size * cam.zoom, 8) - 9);
    }
  }

  /* --- 悬停光环 --- */
  if (hoverBody) {
    const wp = focusPos(hoverBody);
    const s = w2s(wp.x, wp.y);
    const rr = Math.max((hoverBody.size || sun.size) * cam.zoom, 9) + 9;
    ctx.strokeStyle = "rgba(255, 220, 150, 0.75)";
    ctx.lineWidth = 1.2;
    ctx.setLineDash([4, 5]);
    ctx.beginPath(); ctx.arc(s.x, s.y, rr + Math.sin(now * 0.004) * 2, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }

  /* --- 特效：目标锁定环 / 彗星近日点闪光 --- */
  for (const e of fx) {
    if (e.type === "lock") {
      const wp = focusPos(e.body);
      const s = w2s(wp.x, wp.y);
      const R = Math.max((e.body.size || 8) * cam.zoom, 10) + 14;
      const ease = 1 - Math.pow(1 - e.t, 3);
      for (const [mul, lw, al] of [[1.9, 1.6, 0.85], [1.42, 1.0, 0.5]]) {
        ctx.globalAlpha = (1 - e.t) * al;
        ctx.strokeStyle = "#ffd68c";
        ctx.lineWidth = lw;
        ctx.beginPath(); ctx.arc(s.x, s.y, R * lerp(mul, 1.05, ease), 0, TAU); ctx.stroke();
      }
      // 旋转收拢的四角括号
      ctx.globalAlpha = (1 - e.t) * 0.9;
      ctx.strokeStyle = "#ffe3a3";
      ctx.lineWidth = 1.8;
      const br = R * 1.3, bl = R * 0.34;
      for (let q = 0; q < 4; q++) {
        const a2 = q * Math.PI / 2 + Math.PI / 4 + ease * 1.3;
        const cx2 = s.x + Math.cos(a2) * br, cy2 = s.y + Math.sin(a2) * br;
        const dx = Math.cos(a2 + Math.PI / 2), dy = Math.sin(a2 + Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(cx2 - dx * bl, cy2 - dy * bl);
        ctx.lineTo(cx2 + dx * bl, cy2 + dy * bl);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else if (e.type === "flash") {
      const cp = cometPos();
      const s = w2s(cp.x, cp.y);
      const ease = 1 - Math.pow(1 - e.t, 2);
      const rr = 16 + ease * 46 * cam.zoom;
      ctx.globalAlpha = (1 - e.t) * 0.8;
      ctx.strokeStyle = "#bef0ff";
      ctx.lineWidth = 2.2 * (1 - e.t) + 0.4;
      ctx.beginPath(); ctx.arc(s.x, s.y, rr, 0, TAU); ctx.stroke();
      ctx.globalAlpha = (1 - e.t) * 0.3;
      ctx.fillStyle = "#bef0ff";
      ctx.beginPath(); ctx.arc(s.x, s.y, rr * 0.45, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  /* --- warp 速度线：镜头长距离飞行时边缘光流 --- */
  if (warp.amt > 0.02) {
    const base = Math.min(W, H);
    ctx.lineCap = "round";
    for (const st of streaks) {
      const r0 = st.r0 * base, r1 = r0 + st.len * base * (0.5 + warp.amt * 1.8);
      ctx.globalAlpha = warp.amt * 0.75 * (0.4 + 0.6 * Math.random());
      ctx.strokeStyle = "rgba(205, 224, 255, 1)";
      ctx.lineWidth = st.w;
      ctx.beginPath();
      ctx.moveTo(CX + Math.cos(st.ang) * r0, CY + Math.sin(st.ang) * r0);
      ctx.lineTo(CX + Math.cos(st.ang) * r1, CY + Math.sin(st.ang) * r1);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.lineCap = "butt";
  }
}

/* ---------- 行星绘制 ---------- */
function drawPlanet(b, x, y, now) {
  const R = b.size;
  const sunDir = Math.atan2(-y, -x);                 // 指向太阳
  const off = R * 0.45;
  const gx = x + Math.cos(sunDir) * off, gy = y + Math.sin(sunDir) * off;

  // 大气辉光
  if (b.glow) {
    const gg = ctx.createRadialGradient(x, y, R * 0.6, x, y, R * 2.1);
    gg.addColorStop(0, b.glow);
    gg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(x, y, R * 2.1, 0, TAU); ctx.fill();
  }

  // 土星环（后半：远端）
  if (b.ring) drawRing(b, x, y, true);

  // 本体：受光面渐变
  const g = ctx.createRadialGradient(gx, gy, R * 0.1, x, y, R * 1.35);
  g.addColorStop(0, lighten(b.base, 0.35));
  g.addColorStop(0.55, b.base);
  g.addColorStop(1, b.dark);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.fill();

  // 木星条纹 + 大红斑
  if (b.bands) {
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.clip();
    ctx.globalAlpha = 0.30;
    const flow = Math.sin(now * 0.0004) * R * 0.08;
    const bands = [-0.55, -0.2, 0.15, 0.5];
    for (const t of bands) {
      ctx.fillStyle = "#a06a3e";
      ctx.fillRect(x - R, y + t * R + flow * Math.sign(t) - R * 0.07, R * 2, R * 0.14);
    }
    if (b.spot) {
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = "#c2523a";
      ctx.beginPath();
      ctx.ellipse(x + R * 0.34, y + R * 0.3, R * 0.22, R * 0.13, -0.3, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // 边缘描一道细光
  ctx.strokeStyle = "rgba(255,255,255,0.10)";
  ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.stroke();

  // 土星环（前半）
  if (b.ring) drawRing(b, x, y, false);

  // 地球的月球
  if (b.moon) {
    const m = b.moon;
    const ma = b.ang / m.period;
    const mx = x + Math.cos(ma) * m.r, my = y + Math.sin(ma) * m.r;
    const mg = ctx.createRadialGradient(mx - m.size * 0.4, my - m.size * 0.4, m.size * 0.1, mx, my, m.size * 1.3);
    mg.addColorStop(0, m.base); mg.addColorStop(1, m.dark);
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(mx, my, m.size, 0, TAU); ctx.fill();
  }
}

function drawRing(b, x, y, backHalf) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-0.45);
  const R = b.size;
  const rings = [
    { rx: R * 1.45, ry: R * 0.44, w: R * 0.34, c: "rgba(230, 205, 155, 0.55)" },
    { rx: R * 1.85, ry: R * 0.56, w: R * 0.22, c: "rgba(205, 180, 130, 0.38)" },
    { rx: R * 2.12, ry: R * 0.64, w: R * 0.10, c: "rgba(225, 205, 165, 0.26)" },
  ];
  for (const r of rings) {
    ctx.strokeStyle = r.c;
    ctx.lineWidth = r.w;
    ctx.beginPath();
    ctx.ellipse(0, 0, r.rx, r.ry, 0, backHalf ? Math.PI : 0, backHalf ? TAU : Math.PI);
    ctx.stroke();
  }
  ctx.restore();
}

function lighten(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(((n >> 16) & 255) + 255 * amt, 0, 255) | 0;
  const g = clamp(((n >> 8) & 255) + 255 * amt, 0, 255) | 0;
  const b = clamp((n & 255) + 255 * amt, 0, 255) | 0;
  return `rgb(${r},${g},${b})`;
}

/* ---------- 太阳绘制 ---------- */
function drawSun(now) {
  const pulse = 1 + Math.sin(now * 0.0011) * 0.045 + Math.sin(now * 0.0031) * 0.02;
  const R = sun.size;

  // 外层日冕（多层）
  for (const [mul, a] of [[9.5, 0.055], [6.2, 0.09], [3.6, 0.16]]) {
    const cr = R * mul * pulse;
    const g = ctx.createRadialGradient(0, 0, R * 0.5, 0, 0, cr);
    g.addColorStop(0, `rgba(255, 190, 100, ${a})`);
    g.addColorStop(0.55, `rgba(255, 140, 60, ${a * 0.45})`);
    g.addColorStop(1, "rgba(255, 120, 40, 0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, cr, 0, TAU); ctx.fill();
  }

  // 耀斑日珥：从表面鼓起的抛物弧，随相位循环生灭（zoom 大时收敛，避免成"线圈"）
  const flareFade = clamp(1.6 / cam.zoom, 0.25, 1);
  for (const f of flares) {
    const prog = (now * 0.00012 * f.speed * 60 + f.phase) % 1;     // 0→1 循环
    const alpha = Math.sin(prog * Math.PI) * 0.30 * flareFade;
    const a0 = f.baseAng + Math.sin(now * 0.0002 + f.phase * 9) * 0.15;
    ctx.strokeStyle = `hsla(${f.hue}, 100%, 66%, ${alpha})`;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    const segN = 16;
    const spread = f.spread * 0.6 * (0.5 + 0.5 * flareFade);
    const hMax = R * (1.05 + f.h * 0.42 * Math.sin(prog * Math.PI));
    for (let i = 0; i <= segN; i++) {
      const t = i / segN;
      const ang = a0 - spread / 2 + spread * t;
      const h = R * 1.02 + (hMax - R) * Math.sin(t * Math.PI);     // 表面鼓起的弓形
      const px = Math.cos(ang) * h, py = Math.sin(ang) * h;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.stroke();
  }

  // 本体
  const g2 = ctx.createRadialGradient(-R * 0.2, -R * 0.2, R * 0.1, 0, 0, R * 1.05);
  g2.addColorStop(0, "#fff8e8");
  g2.addColorStop(0.5, "#ffdd8f");
  g2.addColorStop(0.92, "#ff9c46");
  g2.addColorStop(1, "rgba(255, 130, 50, 0.6)");
  ctx.fillStyle = g2;
  ctx.beginPath(); ctx.arc(0, 0, R * pulse, 0, TAU); ctx.fill();
}

/* ============================================================
   DOM 同步（标签 / 信息卡）
   ============================================================ */
const CFG = { orbits: true, labels: true, sound: false };
const tip = document.getElementById("tip");
const card = document.getElementById("card");
let cardShownFor = null;

function syncDom() {
  // 悬停 tip（聚焦跟随对象不显示 tip）
  if (hoverBody && hoverBody !== focusBody) {
    const s = w2s(focusPos(hoverBody).x, focusPos(hoverBody).y);
    tip.style.display = "block";
    tip.style.left = s.x + "px";
    tip.style.top = s.y + "px";
    tip.textContent = hoverBody.name + " · " + hoverBody.en;
  } else {
    tip.style.display = "none";
  }
  // 信息卡
  if (focusBody !== cardShownFor) {
    if (focusBody) {
      fillCard(focusBody);
      card.classList.add("show");
      requestAnimationFrame(() => card.classList.add("vis"));
    } else {
      card.classList.remove("vis");
      setTimeout(() => card.classList.remove("show"), 350);
    }
    cardShownFor = focusBody;
  }
  document.getElementById("backBtn").classList.toggle("show", !!focusBody);
  syncNav();
}
// 导航条高亮同步
function syncNav() {
  const order = focusOrder();
  document.querySelectorAll("#nav button").forEach(btn =>
    btn.classList.toggle("on", order[+btn.dataset.i] === focusBody));
}
function fillCard(b) {
  document.getElementById("cName").textContent = b.name;
  document.getElementById("cEn").textContent = b.en;
  document.getElementById("cDia").textContent = b.dia;
  document.getElementById("cPer").textContent = b.per;
  document.getElementById("cDist").textContent = b.dist;
  document.getElementById("cFun").textContent = b.fun;
}

/* ============================================================
   交互
   ============================================================ */
canvas.addEventListener("pointerdown", e => {
  ensureAudio();
  drag.on = true; drag.moved = false;
  drag.sx = e.clientX; drag.sy = e.clientY;
  drag.cx = cam.tx; drag.cy = cam.ty;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  if (drag.on) {
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (Math.hypot(dx, dy) > 4) drag.moved = true;
    if (drag.moved && !focusBody) {
      cam.tx = cam.x = drag.cx - dx / cam.zoom;
      cam.ty = cam.y = drag.cy - dy / cam.zoom;
    } else if (drag.moved && focusBody) {
      // 跟随中拖拽 = 解除跟随并保留当前镜头，继续自由平移
      setFocus(null, true);
      cam.tx = cam.x = drag.cx - dx / cam.zoom;
      cam.ty = cam.y = drag.cy - dy / cam.zoom;
    }
  }
});
window.addEventListener("pointerup", e => { drag.on = false; });
canvas.addEventListener("pointerleave", () => { mouse.active = false; });

canvas.addEventListener("click", e => {
  if (drag.moved) return;
  ensureAudio();
  const hit = pickBody(e.clientX, e.clientY);      // 即时命中，不依赖上一帧悬停
  if (hit) setFocus(hit);
  else if (focusBody) setFocus(null);
});
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const factor = Math.pow(1.0016, -e.deltaY);
  const nz = clamp(cam.tzoom * factor, ZMIN, ZMAX);
  // 以鼠标位置为锚缩放
  const before = s2w(e.clientX, e.clientY);
  cam.tzoom = nz;
  const after = s2w(e.clientX, e.clientY);
  cam.tx += before.x - after.x;
  cam.ty += before.y - after.y;
  if (focusBody) setFocus(null, true);        // 手动缩放解除跟随但保留镜头
}, { passive: false });

function setFocus(b, keepCam = false) {
  focusBody = b;
  if (b) {
    const p = focusPos(b);
    cam.tx = p.x; cam.ty = p.y;
    cam.tzoom = b.viewZoom || clamp(95 / b.size, 1.6, 6.2);
    fx.push({ type: "lock", body: b, t: 0 });     // 目标锁定动画
    sfxWhoosh();
    showToast("正在前往 " + b.name + " · ←/→ 切换目标");
  } else if (!keepCam) {
    cam.tx = 0; cam.ty = 0; cam.tzoom = fitZoom();
    sfxBlip(420);
  }
}

function fitZoom() {
  return clamp(Math.min(W, H) / 860, 0.5, 1.6);   // 默认更近：土星轨道撑满画面
}

window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); togglePause(); }
  else if (e.key === "Escape") setFocus(null);
  else if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    // 在 太阳 → 八大行星 → 彗星 之间循环切换视角
    e.preventDefault();
    const list = focusOrder();
    let i = list.indexOf(focusBody);
    i = i < 0 ? 0 : (i + (e.key === "ArrowRight" ? 1 : -1) + list.length) % list.length;
    setFocus(list[i]);
  }
});

function togglePause() {
  paused = !paused;
  document.getElementById("playBtn").textContent = paused ? "▶" : "❚❚";
  showToast(paused ? "时间已冻结" : "时间恢复流动");
  sfxBlip(paused ? 380 : 620);
}

/* ---------- UI 绑定 ---------- */
const toast = document.getElementById("toast");
let toastTimer = 0;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1500);
}

document.getElementById("playBtn").addEventListener("click", togglePause);
document.getElementById("spd").addEventListener("input", e => {
  speed = +e.target.value;
  document.getElementById("spdVal").textContent = speed.toFixed(1) + "×";
});
document.getElementById("swOrbit").addEventListener("change", e => CFG.orbits = e.target.checked);
document.getElementById("swLabel").addEventListener("change", e => CFG.labels = e.target.checked);
document.getElementById("swSnd").addEventListener("change", e => {
  CFG.sound = e.target.checked;
  ensureAudio();
  if (CFG.sound) { if (AC && AC.state === "suspended") AC.resume(); startPad(); sfxBlip(700); }
  else stopPad();
});
document.getElementById("backBtn").addEventListener("click", () => setFocus(null));
const help = document.getElementById("help");
document.getElementById("hintBtn").addEventListener("click", () => help.classList.add("show"));
document.getElementById("helpClose").addEventListener("click", () => { help.classList.remove("show"); ensureAudio(); });
help.addEventListener("click", e => { if (e.target === help) help.classList.remove("show"); });

/* ============================================================
   主循环
   ============================================================ */
function tick(now) {
  const rawDt = clamp((now - lastT) / 1000, 0.001, 0.1);
  lastT = now;
  update(rawDt);
  render(now);
  requestAnimationFrame(tick);
}

resize();
// 开场镜头：从深空远处飞入到近景
cam.zoom = fitZoom() * 0.38;
cam.tzoom = fitZoom();
// 目标导航条：太阳 → 八大行星 → 彗星
(function buildNav() {
  const nav = document.getElementById("nav");
  focusOrder().forEach((b, i) => {
    const btn = document.createElement("button");
    btn.textContent = b.name;
    btn.dataset.i = i;
    btn.addEventListener("click", () => { ensureAudio(); setFocus(b); });
    nav.appendChild(btn);
  });
})();
requestAnimationFrame(tick);

// 只读调试/自动化接口（不影响行为）
window.__solar = { w2s, s2w, BODIES, bodyPos, sun, comet,
  getHover: () => hoverBody, getFocus: () => focusBody, cam, setFocus, warp, fx };
})();
</script>
